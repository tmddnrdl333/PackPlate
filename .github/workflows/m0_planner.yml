# Project 3 M0: reruns the meal planner eval (proj_2/eval_planner) and checks it
# reproduces eval_planner/results.json. Passing means the committed numbers
# reproduce, not that the targets were met (targets and result are in
# proj_2/docs/p3-m0-planner-eval.md and results.json).
# It fails if the eval crashes, the hand-check sheet no longer matches the
# snapshots and the draw, or the numbers change without results.json being updated.
# Separate from m0.yml and m0_loop2.yml (the original team's evals).
name: P3 M0 planner

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m0_planner:
    name: P3 M0 planner eval reproduces
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj_2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            proj_2/requirements-dev.txt
            proj_2/backend/requirements.txt
            proj_2/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the planner eval and compare with results.json
        run: python -m eval_planner.m0 --check
